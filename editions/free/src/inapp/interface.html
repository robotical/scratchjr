<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
        window.scratchJrPage = 'inappInterfaceGuide';
    </script>
    <script type="text/javascript" src="../app.bundle.js"></script>
  </head>
  <body>
    <div id="content">
      <div id="ipad-project-view-wrapper">
        <section class="learn-tab learn-tab-selected learn-interface" aria-labelledby="interface-guide-eyebrow">
          <div class="interface-preview">
            <img class="ipad-project-view" src="images/interface.png" alt="" />

            <svg class="interface-connectors" id="interface-connectors" viewBox="0 0 1916 989"
              preserveAspectRatio="none" aria-hidden="true" focusable="false">
              <g class="interface-connector" data-guide-key="SAVE">
                <line x1="3%" y1="-7%" x2="2.2%" y2="18.2%" /><circle cx="2.2%" cy="18.2%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="DEVICE_CONNECTIONS">
                <line x1="9.5%" y1="-7%" x2="6.6%" y2="7.3%" /><circle cx="6.6%" cy="7.3%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="EXTENSIONS">
                <line x1="16%" y1="-7%" x2="11.7%" y2="12.4%" /><circle cx="11.7%" cy="12.4%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="SPRITES_AND_DEVICES">
                <line x1="2%" y1="28%" x2="9.5%" y2="28%" /><circle cx="9.5%" cy="28%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="PRESENTATION_MODE">
                <line x1="32%" y1="-7%" x2="36.4%" y2="4.7%" /><circle cx="36.4%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="GRID">
                <line x1="38.5%" y1="-7%" x2="40.7%" y2="4.7%" /><circle cx="40.7%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="TRACE">
                <line x1="45%" y1="-7%" x2="44.8%" y2="4.7%" /><circle cx="44.8%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="CLEAR_TRACE">
                <line x1="51.5%" y1="-7%" x2="47.5%" y2="4.7%" /><circle cx="47.5%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="CHANGE_BG">
                <line x1="58%" y1="-7%" x2="52.3%" y2="4.7%" /><circle cx="52.3%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="ADD_TEXT">
                <line x1="64.5%" y1="-7%" x2="56.5%" y2="4.7%" /><circle cx="56.5%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="RESET_CHAR">
                <line x1="71%" y1="-7%" x2="60.9%" y2="4.7%" /><circle cx="60.9%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="GREEN_FLAG">
                <line x1="77.5%" y1="-7%" x2="65.1%" y2="4.7%" /><circle cx="65.1%" cy="4.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="STAGE">
                <line x1="72%" y1="31.5%" x2="65.2%" y2="31.5%" /><circle cx="65.2%" cy="31.5%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="MARTY_MODE">
                <line x1="88%" y1="-7%" x2="91.1%" y2="5.7%" /><circle cx="91.1%" cy="5.7%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="PAGES">
                <line x1="98%" y1="28%" x2="89.8%" y2="24%" /><circle cx="89.8%" cy="24%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="DUPLICATE_PAGE">
                <line x1="98%" y1="14%" x2="86%" y2="14.1%" /><circle cx="86%" cy="14.1%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="PROJECT_INFO">
                <line x1="97%" y1="-7%" x2="98.1%" y2="2.5%" /><circle cx="98.1%" cy="2.5%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="BLOCKS_CATEGORIES">
                <line x1="27%" y1="58.2%" x2="20.5%" y2="58.2%" /><circle cx="20.5%" cy="58.2%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="DEVICE_BLOCK_CATEGORIES">
                <line x1="78%" y1="58.2%" x2="86%" y2="58.2%" /><circle cx="86%" cy="58.2%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="BLOCKS_PALETTE">
                <line x1="10%" y1="107%" x2="12.5%" y2="66.5%" /><circle cx="12.5%" cy="66.5%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="PROGRAMMING_SCRIPT">
                <line x1="29%" y1="107%" x2="29%" y2="80%" /><circle cx="29%" cy="80%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="PROGRAMMING_AREA">
                <line x1="58%" y1="107%" x2="58%" y2="91%" /><circle cx="58%" cy="91%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="UNDO_REDO">
                <line x1="86%" y1="107%" x2="96%" y2="66.2%" /><circle cx="96%" cy="66.2%" r="7" />
              </g>
              <g class="interface-connector" data-guide-key="ZOOM">
                <line x1="98%" y1="107%" x2="98.1%" y2="96.5%" /><circle cx="98.1%" cy="96.5%" r="7" />
              </g>
            </svg>

            <button type="button" class="interface-button interface-button-selected" id="interface-button-save"
              data-guide-key="SAVE" style="--x: 3%; --y: -7%;"><span>1</span></button>
            <button type="button" class="interface-button" id="interface-button-device-connections"
              data-guide-key="DEVICE_CONNECTIONS" style="--x: 9.5%; --y: -7%;"><span>2</span></button>
            <button type="button" class="interface-button" id="interface-button-extensions"
              data-guide-key="EXTENSIONS" style="--x: 16%; --y: -7%;"><span>3</span></button>
            <button type="button" class="interface-button" id="interface-button-sprites-devices"
              data-guide-key="SPRITES_AND_DEVICES" style="--x: 2%; --y: 28%;"><span>4</span></button>
            <button type="button" class="interface-button" id="interface-button-presentation-mode"
              data-guide-key="PRESENTATION_MODE" style="--x: 32%; --y: -7%;"><span>5</span></button>
            <button type="button" class="interface-button" id="interface-button-grid"
              data-guide-key="GRID" style="--x: 38.5%; --y: -7%;"><span>6</span></button>
            <button type="button" class="interface-button" id="interface-button-trace"
              data-guide-key="TRACE" style="--x: 45%; --y: -7%;"><span>7</span></button>
            <button type="button" class="interface-button" id="interface-button-clear-trace"
              data-guide-key="CLEAR_TRACE" style="--x: 51.5%; --y: -7%;"><span>8</span></button>
            <button type="button" class="interface-button" id="interface-button-change-background"
              data-guide-key="CHANGE_BG" style="--x: 58%; --y: -7%;"><span>9</span></button>
            <button type="button" class="interface-button" id="interface-button-add-text"
              data-guide-key="ADD_TEXT" style="--x: 64.5%; --y: -7%;"><span>10</span></button>
            <button type="button" class="interface-button" id="interface-button-reset-characters"
              data-guide-key="RESET_CHAR" style="--x: 71%; --y: -7%;"><span>11</span></button>
            <button type="button" class="interface-button" id="interface-button-green-flag"
              data-guide-key="GREEN_FLAG" style="--x: 77.5%; --y: -7%;"><span>12</span></button>
            <button type="button" class="interface-button" id="interface-button-stage"
              data-guide-key="STAGE" style="--x: 72%; --y: 31.5%;"><span>13</span></button>
            <button type="button" class="interface-button" id="interface-button-marty-mode"
              data-guide-key="MARTY_MODE" style="--x: 88%; --y: -7%;"><span>14</span></button>
            <button type="button" class="interface-button" id="interface-button-pages"
              data-guide-key="PAGES" style="--x: 98%; --y: 28%;"><span>15</span></button>
            <button type="button" class="interface-button" id="interface-button-duplicate-page"
              data-guide-key="DUPLICATE_PAGE" style="--x: 98%; --y: 14%;"><span>16</span></button>
            <button type="button" class="interface-button" id="interface-button-project-information"
              data-guide-key="PROJECT_INFO" style="--x: 97%; --y: -7%;"><span>17</span></button>
            <button type="button" class="interface-button" id="interface-button-block-categories"
              data-guide-key="BLOCKS_CATEGORIES" style="--x: 27%; --y: 58.2%;"><span>18</span></button>
            <button type="button" class="interface-button" id="interface-button-device-block-categories"
              data-guide-key="DEVICE_BLOCK_CATEGORIES" style="--x: 78%; --y: 58.2%;"><span>19</span></button>
            <button type="button" class="interface-button" id="interface-button-block-palette"
              data-guide-key="BLOCKS_PALETTE" style="--x: 10%; --y: 107%;"><span>20</span></button>
            <button type="button" class="interface-button" id="interface-button-programming-script"
              data-guide-key="PROGRAMMING_SCRIPT" style="--x: 29%; --y: 107%;"><span>21</span></button>
            <button type="button" class="interface-button" id="interface-button-programming-area"
              data-guide-key="PROGRAMMING_AREA" style="--x: 58%; --y: 107%;"><span>22</span></button>
            <button type="button" class="interface-button" id="interface-button-undo-redo"
              data-guide-key="UNDO_REDO" style="--x: 86%; --y: 107%;"><span>23</span></button>
            <button type="button" class="interface-button" id="interface-button-zoom"
              data-guide-key="ZOOM" style="--x: 98%; --y: 107%;"><span>24</span></button>
          </div>

          <aside id="interface-key" aria-live="polite">
            <div class="interface-key-eyebrow" id="interface-guide-eyebrow"></div>
            <div id="interface-key-header"></div>
            <div id="interface-key-description"></div>
            <div class="interface-key-hint" id="interface-guide-hint"></div>
          </aside>
        </section>
      </div>
    </div>
  </body>
</html>
