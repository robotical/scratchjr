<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:xlink="http://www.w3.org/1999/xlink">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="cache-control" content="no-cache">
<meta charset="utf-8">

<head>
<title>Scratch Jr</title>

<script>
    window.scratchJrPage = 'home';
</script>
<script type="text/javascript" src="app.bundle.js"></script>

</head>
<body>
<div class="frame" id="frame">
	<div class="topbar" id="topbar">
		<ul class="topbar-nav" id="nav">
			<li>
				<button class="topbar-tab logo" id="logotab" type="button">
					<span class="logo-icon"></span>
				</button>
			</li>
			<div></div>
			<li>
				<button class="topbar-tab home" id="hometab" type="button">
					<span class="home-icon"></span>
				</button>
			</li>
			<!-- <div></div>
			<li class="help" id="helptab">
				<span class="help-icon"></span>
			</li> -->
			<div></div>
		</ul>
        <ul class="reference" id="settings">
            <div></div>
            <li>
                <button class="topbar-tab gear" id="geartab" type="button">
                    <span class="gear-icon"></span>
                </button>
            </li>
       </ul>
		<ul class="reference" id="reference">
			<div></div>
			<li>
				<button class="topbar-tab book" id="booktab" type="button">
					<span class="book-icon"></span>
				</button>
			</li>
	 </ul>
	</div>
	<div class="topsection" id="topsection">
		<div	class="tabtitle" id="tabtitle">
			<span id="tabheader"></span>
		</div>
		<button class="tabicon" id="tabicon" type="button"></button>
		<div class="blueband" id="blueband">
			<span id="subtitle"></span>
		</div>
	</div>
	<div class="contentwrap" id="wrapc"></div>
	<div class="footer off" id="footer">
		<ul class="footer-nav" id="footernav">
			<li>
				<button class="footer-tab-button tab" id="abouttab" type="button">
					<div class="about-icon"></div>
					<span id="abouttab-text"></span>
				</button>
			</li>
			<li>
				<button class="footer-tab-button tab" id="interfacetab" type="button">
					<div class="interface-icon"></div>
					<span id="interfacetab-text"></span>
				</button>
			</li>
			<li>
				<button class="footer-tab-button tab" id="painttab" type="button">
					<div class="paint-icon"></div>
                <span id="painttab-text"></span>
				</button>
			</li>
			<li>
				<button class="footer-tab-button tab" id="blockstab" type="button">
					<div class="blocks-icon"></div>
					<span id="blockstab-text"></span>
				</button>
			</li>
			<li>
				<button class="footer-tab-button tab" id="tutorialstab" type="button">
					<div class="tutorials-icon"></div>
					<span id="tutorialstab-text"></span>
				</button>
			</li>
			<li>
				<button class="footer-tab-button tab2" id="privacytab" type="button">
					<div class="privacy-icon"></div>
					<span id="privacytab-text"></span>
				</button>
			</li>
			<div></div>
		</ul>
	</div>

</div>
</body>
</html>
